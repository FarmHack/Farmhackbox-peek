<style>
/* Shared chrome for the peek site: the tour bar across the top of every page,
   the "this lives on a running box" dialog, and hover/tap tips. Each page keeps
   its own design; everything here is namespaced `peek-` so it cannot collide. */

.peek-bar{
  position:relative;z-index:900;
  background:#0f2d1e;color:#fff;
  font:500 13px/1.3 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:0 16px;padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid rgba(255,255,255,.08);
}
.peek-bar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;min-height:44px}
.peek-brand{font-weight:700;letter-spacing:.01em;color:#fff;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:8px}
.peek-brand small{font-weight:500;color:rgba(255,255,255,.5);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.peek-steps{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;list-style:none;padding:0;margin-top:0;margin-bottom:0}
.peek-steps a{
  display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:6px;
  color:rgba(255,255,255,.72);text-decoration:none;white-space:nowrap;
}
.peek-steps a:hover{background:rgba(255,255,255,.08);color:#fff}
.peek-steps a[aria-current="page"]{background:#fff;color:#0f2d1e}
.peek-steps .n{font:600 10px/1 ui-monospace,Menlo,monospace;opacity:.6}
.peek-steps a[aria-current="page"] .n{opacity:.8}
@media (max-width:760px){
  .peek-bar-inner{padding:6px 0}
  .peek-steps{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
}

/* ── dialog ── */
.peek-modal{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
.peek-modal[hidden]{display:none!important}
.peek-scrim{position:absolute;inset:0;background:rgba(13,30,22,.55);backdrop-filter:blur(2px)}
.peek-dialog{
  position:relative;background:#fff;color:#1a1a1a;border-radius:12px;max-width:30rem;width:100%;
  max-height:calc(100vh - 32px);overflow:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  font:400 14px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:22px 22px 18px;
}
.peek-dialog .eyebrow{margin:0 0 6px;font:700 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#1B5E4B}
.peek-dialog h2{margin:0 0 8px;font-size:18px;line-height:1.25;font-weight:700;letter-spacing:-.01em;color:#111}
.peek-dialog p{margin:0 0 10px;color:#444}
.peek-dialog code{font:12px/1.4 ui-monospace,Menlo,monospace;background:#F0EDE8;padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.peek-dialog dl{margin:10px 0 12px;font-size:13px;border-top:1px solid #eee}
.peek-dialog dl>div{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #eee}
.peek-dialog dt{flex:0 0 5.5rem;color:#888}
.peek-dialog dd{margin:0;min-width:0;overflow-wrap:anywhere}
.peek-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.peek-actions a,.peek-actions button{
  font:600 13px/1 inherit;font-family:inherit;padding:10px 14px;border-radius:7px;cursor:pointer;text-decoration:none;
  border:1px solid #d6d3d1;background:#fff;color:#1a1a1a;
}
.peek-actions .primary{background:#0f2d1e;border-color:#0f2d1e;color:#fff}
.peek-actions a:hover,.peek-actions button:hover{filter:brightness(.95)}
.peek-dialog.wide{max-width:min(92vw,760px)}
.peek-zoom{display:block;width:100%;height:auto;border-radius:8px}
.peek-cap{margin-top:12px;font-weight:600;color:#1a1a1a}
.peek-credit{font-size:12px;color:#888}
.peek-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:20px;line-height:1;color:#666}
.peek-close:hover{background:#f3f3f3;color:#000}
.peek-dialog :focus-visible{outline:2px solid #1D9E75;outline-offset:2px}

/* ── tips (data-tip) — hover on a mouse, tap on a touch screen ── */
.peek-tip{
  position:fixed;z-index:1900;max-width:18rem;pointer-events:none;
  background:#1a1a1a;color:#fff;border-radius:6px;padding:7px 10px;
  font:500 12px/1.4 'Inter',system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);
  opacity:0;transition:opacity .1s;
}
.peek-tip[data-on]{opacity:1}
[data-tip]{cursor:help}
a [data-tip],a[data-tip]{cursor:pointer}

</style>
<style>

  --fhb-color-ecosystem-water-100:#CECBF6; --fhb-color-ecosystem-water-600:#534AB7;
  --fhb-color-ecosystem-biodiversity-100:#C0DD97; --fhb-color-ecosystem-biodiversity-600:#3B6D11;
  --fhb-color-ecosystem-equity-100:#F5C4B3; --fhb-color-ecosystem-equity-600:#993C1D;
  --fhb-color-ui-soil:#8B6914; --fhb-color-ui-leaf:#4A7C59; --fhb-color-ui-clay:#C2714F;
  --fhb-color-ui-sky:#87CEEB; --fhb-color-ui-night:#0D3D30; --fhb-color-ui-earth:#5C4A32;

<script>
/* Farm Hack Box · peek site — shared behaviour.
 *
 * These pages were lifted from a running box and from three GitHub drafts. On a
 * box, links like /admin/#/voice or /pos/ open live apps. Here there is no box,
 * so every link is handled one of three ways:
 *
 *   1. it has a page in this set          → go there (the tour stays connected)
 *   2. it only exists on a running box    → open a dialog saying what it is
 *   3. it is a placeholder ("#", no page) → open a dialog saying it is not live
 *
 * External links (farmhack.org, fao.org …) are left alone. Nothing here fetches
 * anything, so the set works from GitHub Pages and from a file:// checkout.
 */
(function () {
  'use strict';

  var STEPS = [

    if (modal) return modal;

    boxDialog(raw, a);
  });

  /* ── tips ── */
  var tip, tipFor = null;
  function showTip(el) {
    if (!tip) { tip = document.createElement('div'); tip.className = 'peek-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
    tip.textContent = el.getAttribute('data-tip');
    tip.setAttribute('data-on', '');
    tipFor = el;
    var r = el.getBoundingClientRect();
    var x = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2));
    var y = r.top - tip.offsetHeight - 8;
    if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';

  function hideTip() { if (tip) tip.removeAttribute('data-on'); tipFor = null; }
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest && e.target.closest('[data-tip]');

  document.addEventListener('click', function (e) {
    if (!coarse) return;
    var el = e.target.closest('[data-tip]');
    if (el && el !== tipFor) { e.preventDefault(); e.stopPropagation(); showTip(el); }
    else if (!el) hideTip();

  window.addEventListener('scroll', function () { if (tipFor && document.contains(tipFor)) showTip(tipFor); else hideTip(); }, { passive: true, capture: true });

/* ─────────────────────────────────────────────────────────────────────────────

<script>window.CGO = {"_authored": "Prototype data for a CGO surface. The four element definitions are quoted from the CGO Collateral Card creative brief (CGO / DWeb, front-and-back card, 2026-07-05). Everything under `components` was read from this box on 2026-09-18 — counts are live query results, not estimates. On the box this file would be generated the way agroecology.json is: a YAML map plus a build script, not authored here.", "attribution": {"source_label": "CGO Collateral Card — creative brief", "byline": "CGO / DWeb · card front-and-back · four elements", "tagline": "The community is the way.", "naming_note": "The card expands CGO as Community Governed Organizations. The Cohort-2 hardware concept note calls the same group Community Governance of Open Knowledge, and this box's ground profile said Commons Governance Organization. Three expansions, one acronym — the card's is used here.", "art_note": "The artwork is Jenni's, created for the CGO card and used here as intended. This page takes its palette and its statement-over-explanation pattern from the same piece."}, "regimes": {"owner": "Owner-held", "research": "Research consent", "governance": "Governance testimony", "education": "Education records", "public": "Public reference", "administrative": "Administrative"}, "hubs": [{"id": "farmer", "label": "Farmer", "regime": "owner", "roles": 5, "cards": 36}, {"id": "science", "label": "Science", "regime": "research", "roles": 4, "cards": 12}, {"id": "commons", "label": "Commons", "regime": "public", "roles": 6, "cards": 23}, {"id": "district", "label": "District", "regime": "governance", "roles": 1, "cards": 1}, {"id": "school", "label": "School", "regime": "education", "roles": 2, "cards": 26}, {"id": "box-admin", "label": "Box Admin", "regime": "administrative", "roles": 0, "cards": 11}], "elements": [{"n": 1, "key": "roles", "title": "Roles", "statement": "Say who decides, out loud.", "line": "Responsibility that is never named lands on whoever is nearest — and cannot be handed on.", "icon": "fi:fair-labor", "essence": "The defined responsibilities and decision making authority each community member holds within the CGO's governance structure.", "practice": "On a box, a role is not a job title — it is what the software will and will not let a person see and do, in every app at once. The box keeps one vocabulary and maps it outward to farmOS, LiteFarm, the POS and the rest.", "reflect": "Who here can say no, and to whom? Name the person, not the position.", "count": 12, "count_label": "roles defined", "components": [{"id": "roles", "title": "Role vocabulary", "state": "live", "detail": "12 roles, each mapping to a farmOS, LiteFarm, POS, grazing and CFC role plus Authelia groups", "lands_in": "shared.roles — box_admin, manager, worker, farmer, customer, viewer, researcher, librarian, district_planner, food_service, educator, student"}, {"id": "people", "title": "People holding a role", "state": "live", "detail": "28 people, but only 5 of the 12 roles are actually held: farmer 16, viewer 7, box_admin 3, worker 1, manager 1", "lands_in": "shared.people.box_role"}, {"id": "hub-role", "title": "Role × hub", "state": "live", "detail": "18 mappings decide which hub each role can enter. Box Admin has none — it is superuser-only by design", "lands_in": "commons.hub_role"}, {"id": "role-grant", "title": "Scoped grants", "state": "partial", "detail": "Scoped, expiring and revocable grants, additive to the standing role — the mechanism a CGO needs to lend authority without handing it over. Built and verified; 0 issued", "lands_in": "shared.role_grant — 0 rows"}, {"id": "authelia", "title": "One identity, every app", "state": "live", "detail": "Single sign-on carries the role into each application rather than each app keeping its own user list", "lands_in": "Authelia groups per role"}], "gap": {"detail": "The vocabulary has no word for the roles the card is actually about. There is no steward, no witness, no convener — the people who hold authority in a CGO handoff are unrepresentable, so the box records the farm role someone happens to have instead.", "suggestion": "Add steward and witness to shared.roles, and issue them as scoped grants rather than standing roles: authority for this cycle, this hub, this cohort. The grant table is already built and waiting for its first row."}, "hub_presence": {"farmer": "5 roles", "science": "4 roles", "commons": "6 roles", "district": "1 role", "school": "2 roles", "box-admin": "superuser only"}}, {"n": 2, "key": "protocols", "title": "Protocols", "statement": "Write it so it holds without you.", "line": "An agreement that works only while its author is in the room is a habit, not a protocol.", "icon": "fi:fhb-governance", "essence": "The agreed upon rules and procedures that guide correct conduct, communication, and decision-making within the community and organization.", "practice": "The box's protocols are written twice: once in words people read aloud and sign, and once as rules the database enforces. Where only the first exists, the protocol is a promise; where both exist, it is a mechanism.", "reflect": "Which of your agreements would still hold if the person who wrote them left?", "count": 6, "count_label": "consent regimes declared", "components": [{"id": "regimes", "title": "Consent regimes", "state": "live", "detail": "Six regimes, each naming what withdrawal actually does. Governance testimony cannot un-make a published recommendation — withdrawal damages legitimacy, not accuracy. Education records make exposure unrepresentable rather than merely discouraged", "lands_in": "commons.consent_regime — one per hub"}, {"id": "receipts", "title": "Consent receipts", "state": "live", "detail": "31 receipts: 18 for lots, 6 for people, 4 for peer boxes, 2 for farms, 1 given by voice. None revoked; one carries an expiry", "lands_in": "governance.consent_receipt, 2026-07-31 → 2026-09-06"}, {"id": "stewards-agreement", "title": "The Steward's Agreement", "state": "live", "detail": "Five questions, seven affirmations, seven reciprocities, revisable by the stewards who live under it. Carried on the shelf as text, and used as a setup gate", "lands_in": "canon shelf · Field Zine #2 v1.1"}, {"id": "phase-revocation", "title": "Phase-dependent revocation", "state": "live", "detail": "During listening a withdrawal deletes; after publication it can only record an amendment. Enforced by a trigger, not by a convention", "lands_in": "cll_lwg_cycles.status"}, {"id": "odrl", "title": "Machine-readable terms", "state": "planned", "detail": "The table that would let a receipt point at terms software can act on is empty, so every receipt's terms are prose a human must read", "lands_in": "governance.odrl_policies — 0 rows"}, {"id": "custody", "title": "Custody ≠ access", "state": "partial", "detail": "Holding someone's backup is deliberately a different permission from reading it. Built; no grant issued yet", "lands_in": "governance.custody_grant, custody_holding — 0 rows"}], "gap": {"detail": "31 receipts point at 0 machine-readable policies. The consent layer can record that somebody agreed, but not what they agreed to in a form any other program can check — which is precisely the part that has to travel when data moves between boxes.", "suggestion": "Write one ODRL policy per consent regime — six rows — and bind existing receipts to them. That turns the receipt from a note into a term."}, "hub_presence": {"farmer": "owner-held", "science": "research consent", "commons": "public reference", "district": "governance testimony", "school": "education records", "box-admin": "administrative"}}, {"n": 3, "key": "tools", "title": "Tools", "statement": "A decision should leave a trace.", "line": "The instruments a group decides with are the record of how it decided, or they are nothing.", "icon": "fi:fhb-co-creation", "essence": "The analog, digital, and procedural instruments (e.g., voting platforms, digital wallets, data systems) that enable the CGO to function and make collective decisions.", "practice": "Most of this box is tools, so the question is not how many there are but which ones a decision actually passes through — and whether they leave a trace anyone can check afterwards.", "reflect": "When your group decided something last, what did you use — and could a stranger reconstruct the decision from what it left behind?", "count": 109, "count_label": "cards across six hubs", "components": [{"id": "gov-surfaces", "title": "Governance surfaces", "state": "live", "detail": "Policies, Consent, Researchers and the Audit Log — the four screens in the launcher's Governance section", "lands_in": "/admin/#/governance"}, {"id": "hubs", "title": "Hubs", "state": "live", "detail": "Six hubs, 109 cards. Each hub carries its own consent regime, so where a tool sits decides the terms it works under", "lands_in": "commons.hub, hub_card"}, {"id": "question-sets", "title": "Talk to the … question sets", "state": "live", "detail": "The interview tool the card itself points at — structured conversations that produce cards rather than a form that produces rows", "lands_in": "the question-set suite"}, {"id": "eta", "title": "Ethical Tech Assessment", "state": "live", "detail": "Scores a tool against the GIAA six pillars. 143 assessments held, none of them of this box's own equipment", "lands_in": "/eta/"}, {"id": "audit", "title": "Audit log", "state": "partial", "detail": "818 events, every one written by `system` and every one from the certification pipeline. Zero governance or consent actions are logged", "lands_in": "governance.audit_log"}, {"id": "researcher-access", "title": "Researcher access", "state": "planned", "detail": "The surface for granting an outsider consent-gated access exists; no grant has been made", "lands_in": "governance.researcher_access — 0 rows"}], "gap": {"detail": "The audit log is the tool whose entire job is to make decisions reviewable, and it holds no decisions — 818 rows of certification machinery and not one consent grant, role change or withdrawal. A CGO that cannot show its own decision history has tools but no accountability.", "suggestion": "Log every write to consent_receipt, role_grant and custody_grant as a governance event with a human actor. The table already has the columns; nothing writes to them."}, "hub_presence": {"farmer": "36 cards", "science": "12 cards", "commons": "23 cards", "district": "1 card", "school": "26 cards", "box-admin": "11 cards"}}, {"n": 4, "key": "ceremonies", "title": "Ceremonies", "statement": "Some moments should not be a form.", "line": "A gathering that marks a transition is what makes a decision belong to the people in the room.", "icon": "fi:fhb-food-traditions", "essence": "The intentional gatherings or rituals that mark important moments, decisions, or transitions, grounding the organization's work in cultural and relational meaning.", "practice": "The box already has one real ceremony: a new box will not finish its setup until its steward has answered five questions — LAND, COMMUNITY, LINEAGE, BOX, FUTURE STEWARD — in their own words, in front of a witness who cannot revise the answer. Seven boxes were handed over that way.", "reflect": "What moment in your community's year would be wrong to do over a form?", "count": 2, "count_label": "handovers recorded on this box", "components": [{"id": "five-questions", "title": "The Five Questions", "state": "live", "detail": "A technical gate, not paperwork: the first-run wizard does not complete and federation is not offered until the answer is recorded", "lands_in": "the setup wizard · canon shelf"}, {"id": "enrollment", "title": "Recorded handovers", "state": "partial", "detail": "Two completed enrolments are recorded here. Seven boxes were handed over in the GIAA / DWeb Camp ritual — the other five left no row on this box", "lands_in": "flash.enrollment_completion — 2 rows"}, {"id": "cycle-phases", "title": "Cycle phases", "state": "live", "detail": "Pu <script>
(function(){
'use strict';
var D = window.CGO, view = document.getElementById('view');
var ACC = { roles:'var(--clay)', protocols:'var(--teal)', tools:'var(--corn)', ceremonies:'var(--sage)' };
var STATE_DOT = { live:'#4CAF50', partial:'#F57F17', planned:'#BDBDBD' };
var STATE_SAYS = { live:'in use', partial:'built, barely used', planned:'not built yet' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
/* A numbered medallion, not an icon. The box's four fhb-* glyphs are all
   hexagon-framed and read as the same mark at 22px, and the card's imagery is
   illustration rather than iconography — so the element's number in its own
   colour is both clearer and honest about where the artwork belongs. */
function mark(el,size){
  size = size || 34;
  return '<span class="medallion" style="width:'+size+'px;height:'+size+'px;border-color:'+ACC[el.key]+';color:'+ACC[el.key]+
    ';font-size:'+Math.round(size*.46)+'px">'+el.n+'</span>';
}
function band(){ return '<div class="band">'+D.elements.map(function(e){ return '<i style="background:'+ACC[e.key]+'"></i>'; }).join('')+'</div>'; }
function attribution(){
  var a = D.attribution;
  return esc(a.source_label)+' · '+esc(a.byline)+' · the Steward’s Agreement, on the canon shelf';
}
function figure(i){
  var a = (D.art||[])[i];
  if (!a) return '';
  return '<figure class="art"><img src="'+esc(a.src)+'" alt="'+esc(a.alt)+'" loading="lazy" data-zoom'+
    ' data-caption="'+esc(a.caption)+'" data-credit="'+esc(a.credit)+'">'+
    '<figcaption><b>'+esc(a.caption)+'</b>'+esc(a.credit)+'</figcaption></figure>';
}
function artslot(kind, text){
  return '<div class="artslot"><span class="k">'+esc(kind)+'</span><span class="t">'+esc(text)+'</span></div>';
}
function reflections(hint){
  return '<section class="reflectbox"><h2><i></i>Reflections<i></i></h2><ol>'+
    D.reflections.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('')+'</ol>'+
    (hint ? '<p class="hint">'+esc(hint)+'</p>' : '')+'</section>';
}

/* ───────────── the card, unfolded ───────────── */
function block(el){
  return '<a class="q-card" style="--acc:'+ACC[el.key]+'" href="#/'+el.n+'">'+
    '<div class="top"><span class="n">0'+el.n+'</span><h3>'+esc(el.title)+'</h3></div>'+
    '<p class="statement">'+esc(el.statement)+'</p>'+
    '<p class="line">'+esc(el.line)+'</p>'+
    '<p class="quote">'+esc(el.essence)+'</p>'+
    '<div class="holds"><b>'+el.count+'</b><span>'+esc(el.count_label)+'</span></div>'+
    '<div class="spheres">'+el.components.map(function(c){
      return '<span class="sph '+(c.state==='live'?'has':'none')+'" data-tip="'+esc(c.title+' — '+STATE_SAYS[c.state])+'">'+esc(c.title)+'</span>';
    }).join('')+'</div></a>';
}
function renderList(){
  view.className = 'stack';
  view.innerHTML =
    '<section class="front">'+band()+
      '<div class="frontgrid"><div>'+
        '<p class="eyebrow">Community Governed Organizations</p>'+
        '<h1>Roles, protocols, tools and ceremonies.</h1>'+
        '<p class="tagline">“'+esc(D.attribution.tagline)+'”</p>'+
        '<p class="lede">Four elements make a community able to govern itself: the responsibilities people hold, '+
          'the rules they agree to, the instruments they decide with, and the gatherings that mark a decision. '+
          'This is the card, and then what this box actually holds for each one — including where it holds almost nothing.</p>'+
        '<div class="go"><a href="#/matrix">All four, against the six hubs →</a>'+
          'The Steward’s Agreement →</div>'+
      '</div>'+
      figure(0)+
      '</div>'+
    '</section>'+

    '<section><header class="grp-head"><h2>The four elements</h2>'+
      '<span class="t-faint">From the card. Open one for what is here, what is built but unused, and what is missing.</span></header>'+
      '<div class="blocks">'+D.elements.map(block).join('')+'</div></section>'+

    '<div class="cardpair">'+
      reflections('Write on the card. The box keeps no copy of your answer — that is the point of asking on paper.')+
      figure(1)+
    '</div>'+

    '<section class="front"><div class="cardfoot">'+
      '<p><b>What this page is.</b> The card asks a community to name its own four elements. This surface answers the '+
        'same four questions about the box in front of you, using live counts rather than claims: '+D.elements.map(function(e){ return e.count+' '+e.count_label; }).join(' · ')+'. '+
        'A count is what the software can show, not what a community does — five of the seven boxes handed over in the '+
        'GIAA ritual left no record here, and nothing in the schema knows what a witness is.</p>'+
      '<div class="qrslot">QR<br>SLOT</div>'+
    '</div>'+
    '<p class="t-faint" style="margin-top:14px;font-size:12px">'+attribution()+'</p></section>';
}

/* ───────────── one element ───────────── */
function component(c){
  return '<div class="comp"><span class="dot'+(c.state==='planned'?' absent':'')+'" style="background:'+(STATE_DOT[c.state]||STATE_DOT.planned)+'" data-tip="'+esc(STATE_SAYS[c.state])+'"></span>'+
    '<span style="min-width:0"><span class="nm">'+esc(c.title)+'</span>'+
    '<span class="rl"><span>'+esc(STATE_SAYS[c.state])+'</span></span>'+
    '<span class="li" style="font-family:inherit;font-size:13px;color:var(--ink-soft);line-height:1.65">'+esc(c.detail)+'</span>'+
    '<span class="li">'+esc(c.lands_in)+'</span></span></div>';
}
function renderElement(n){
  var el = D.elements.filter(function(e){ return String(e.n)===String(n); })[0];
  if (!el) { view.className=''; view.innerHTML='<p class="t-body">No such element. <a class="lnk" href="#/">Back to CGO</a></p>'; return; }
  var prev = D.elements[el.n-2], next = D.elements[el.n], acc = ACC[el.key];
  view.className = 'stack-sm el-page';
  view.innerHTML =
    '<div class="crumb"><a href="#/">CGO</a><span>·</span><span>element '+el.n+' of 4</span></div>'+
    '<div class="card pad-lg" style="--acc:'+acc+';border-left:5px solid '+acc+'"><div class="el-head">'+mark(el,44)+'<div style="min-width:0">'+
      '<div class="el-n">Element '+el.n+' / 4</div><h1>'+esc(el.title)+'</h1>'+
      '<p class="el-statement">'+esc(el.statement)+'</p>'+
      '<p class="el-line">'+esc(el.line)+'</p>'+
      '<p class="quotedef">'+esc(el.essence)+'</p>'+
      '<p class="el-line">'+esc(el.practice)+'</p>'+
      '<div class="reflect"><div class="el-n upper" style="font-family:inherit">Reflect</div><p>'+esc(el.reflect)+'</p></div>'+
      '<div style="font-size:11px;color:var(--ink-faint);margin-top:16px">'+attribution()+'</div>'+
    '</div></div></div>'+

    '<section class="card" style="overflow:hidden"><header class="sect-head"><h2>What this box holds</h2>'+
      '<span class="t-faint">'+el.components.filter(function(c){return c.state==='live';}).length+' of '+el.components.length+
      ' in use · a hollow dot is a mechanism that does not exist yet</span></header>'+
      '<div class="divide">'+el.components.map(function(c){ return '<div class="sph-row">'+component(c)+'</div>'; }).join('')+'</div></section>'+

    '<section class="weak"><h2>Where this element is weak here</h2><p>'+esc(el.gap.detail)+'</p>'+
      '<p class="mt2"><b style="font-weight:600">Suggestion: </b>'+esc(el.gap.suggestion)+'</p></section>'+

    reflections()+

    '<div class="pager">'+(prev?'<a href="#/'+prev.n+'">← '+esc(prev.title)+'</a>':'<span></span>')+
      (next?'<a href="#/'+next.n+'">'+esc(next.title)+' →</a>':'<a href="#/matrix">By hub →</a>')+'</div>';
}

/* ───────────── four elements × six hubs ───────────── */
function renderMatrix(){
  view.className = 'stack-sm';
  view.innerHTML =
    '<section class="front" style="padding:24px 26px">'+band()+
      '<div class="row"><h1 style="font-family:var(--serif);font-size:26px;font-weight:600">The four elements, by hub</h1>'+
      '<a class="lnk" href="#/">← Back to the card</a></div>'+
      '<p class="lede" style="margin-top:8px">Each hub on this box carries its own consent regime, so the same element '+
      'means something different depending on where a person is standing.</p></section>'+
    '<div class="card tblwrap"><table class="mx"><thead><tr><th class="sticky"></th>'+
      D.hubs.map(function(h){ return '<th scope="col"><div class="hub">'+esc(h.label)+'</div><div class="regime">'+esc(D.regimes[h.regime])+'</div></th>'; }).join('')+
    '</tr></thead><tbody>'+
      D.elements.map(function(el){
        return '<tr class="el" style="--acc:'+ACC[el.key]+'"><th scope="row" class="sticky"><a href="#/'+el.n+'">'+mark(el,22)+
          '<span class="rt">'+esc(el.title)+'</span></a></th>'+
          D.hubs.map(function(h){
            var v = el.hub_presence[h.id];
            return v && v !== '—'
              ? '<td><a href="#/'+el.n+'"><span class="cellv">'+esc(v)+'</span></a></td>'
              : '<td style="text-align:center"><span style="color:var(--rule)" data-tip="Nothing here yet — the box does not represent this element in this hub.">·</span></td>';
          }).join('')+'</tr>';
      }).join('')+
    '</tbody></table></div>'+
    '<div style="padding:0 4px"><p style="font-size:13.5px;color:var(--ink-soft);line-height:1.7">The Ceremonies row is the finding, '+
      'not a rendering error: five of six hubs hold nothing, and the sixth holds two device enrolments.</p>'+
      '<p class="t-faint" style="margin-top:8px;color:var(--ink-faint)">'+esc(D.attribution.naming_note)+'</p>'+
      '<p class="t-faint" style="margin-top:8px;color:var(--ink-faint)">'+esc(D.attribution.art_note)+'</p></div>'+
    reflections();
}

/* ───────────── router ───────────── */
function route(){
  var h = (location.hash||'').replace(/^#\/?/,''), crumb = document.getElementById('crumb'), v = 'list';
  if (h === 'matrix') { v='matrix'; renderMatrix(); crumb.innerHTML = '<a href="#/">CGO</a> › <b>By hub</b>'; }
  else if (/^[1-4]$/.test(h)) {
    v='el'; renderElement(h);
    crumb.innerHTML = '<a href="#/">CGO</a> › <b>'+esc(D.elements[+h-1].title)+'</b>';
  } else { renderList(); crumb.innerHTML = '<b>CGO</b>'; }
  document.querySelectorAll('#tabs a').forEach(function(a){
    if (a.getAttribute('data-v') === v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  document.title = (v==='matrix'?'By hub · ':v==='el'?esc(D.elements[+h-1].title)+' · ':'') + 'CGO — Farm Hack Box';
}
window.addEventListener('hashchange', function(){ route(); window.scrollTo(0,0); });
route();
})();
</script>
